name: Validate prototype

on:
  push:
    branches:
      - prototype/lottie-pet
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Rive pet asset
        run: curl -fsSL --retry 2 -o /tmp/miaomiao.riv https://public.rive.app/community/runtime-files/23404-43796-interactive-cute-black-cat.riv && test -s /tmp/miaomiao.riv

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
